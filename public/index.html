<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chating Room Guy - Fun Chat Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Welcome Screen -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-container">
            <div class="logo">
                <h1>🎮 Chating Room Guy</h1>
                <p>Join the fun chat adventure!</p>
            </div>
            
            <div class="room-form">
                <div class="input-group">
                    <input type="text" id="roomId" placeholder="Enter Room ID" maxlength="20">
                    <input type="text" id="username" placeholder="Your Name (optional)" maxlength="15">
                </div>
                
                <div class="button-group">
                    <button id="createRoom" class="btn btn-primary">Create Room</button>
                    <button id="joinRoom" class="btn btn-secondary">Join Room</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <!-- Score Display -->
        <div id="scoreDisplay" class="score-display">
            <span id="scoreText">Score: 0</span>
        </div>

        <!-- Game Canvas -->
        <div id="gameCanvas" class="game-canvas">
            <!-- Users will be rendered here -->
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Type your message..." maxlength="512">
                <button id="sendMessage" class="send-btn">Send</button>
            </div>
            <div class="char-counter">
                <span id="charCount">0</span>/512
            </div>
        </div>

        <!-- Room Info -->
        <div class="room-info" id="roomInfoBtn">
            <span id="roomInfo">Room: </span>
            <span id="playerCount">Players: 0</span>
        </div>
        
        <!-- Room Info Modal -->
        <div id="roomModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Room Information</h3>
                    <span class="close" id="closeModal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="room-details">
                        <p><strong>Room ID:</strong> <span id="modalRoomId"></span></p>
                        <p><strong>Players Online:</strong> <span id="modalPlayerCount"></span></p>
                        <p><strong>Your Score:</strong> <span id="modalYourScore"></span></p>
                    </div>
                    <div class="room-actions">
                        <button id="leaveRoom" class="btn btn-danger">Leave Room</button>
                        <button id="copyRoomId" class="btn btn-secondary">Copy Room ID</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification System -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="script.js"></script>
</body>
</html>
